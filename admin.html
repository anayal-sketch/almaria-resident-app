<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00293B">
<title>Almaria Residence — Building Management Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 540'%3E%3Crect width='640' height='540' fill='%2300293B'/%3E%3Cg fill='none' stroke='%23E8C058' stroke-width='40'%3E%3Cpath d='M35 520V225L230 25L320 116'/%3E%3Cpath d='M229 520V226L425 25L615 226V520'/%3E%3Cpath d='M365 155L425 218V520'/%3E%3Cpath d='M325 375V520'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  /* Almaria brand — UI chrome only */
  --teal-900:#00293B; --teal-800:#00374E; --teal:#004860; --teal-600:#0A5B75;
  --gold:#E8C058; --gold-deep:#C99B32; --gold-soft:#FBF3DE; --gold-ink:#7A5C12;

  /* chart series — validated set (see note in the app) */
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  /* status — fixed, never themed; always with icon + label */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-soft:#E6F4E6; --warning-soft:#FDF3DD; --serious-soft:#FCEDE6; --critical-soft:#FAE8E8;

  /* chart chrome */
  --surface:#FFFFFF; --plane:#F4F6F7;
  --ink:#0F2530; --ink-2:#41545F; --muted:#7C8D97;
  --grid:#E8EDEF; --axis:#CBD5D9; --line:#E2E8EA;
  --r:12px; --shadow:0 1px 2px rgba(15,37,48,.05), 0 6px 18px rgba(15,37,48,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",sans-serif;
  background:var(--plane); color:var(--ink); font-size:14px; line-height:1.5;
  display:flex; overflow:hidden;
}
body.ar{font-family:"Noto Sans Arabic",system-ui,"Segoe UI",sans-serif}
button{font-family:inherit}

/* ---------------- sidebar ---------------- */
.side{
  width:236px; flex:none; background:var(--teal-900); color:#fff;
  display:flex; flex-direction:column; height:100vh
}
.side .brand{padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.10)}
.side .brand img{height:15px;width:206px;object-fit:contain;display:block;opacity:.95}
.side .brand .sub{
  font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.5);
  margin-top:9px; font-weight:700
}
.nav{flex:1; overflow-y:auto; padding:12px 10px}
.nav button{
  width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px; margin-bottom:2px;
  border:none; background:none; color:rgba(255,255,255,.72); border-radius:9px;
  font-size:13.5px; font-weight:600; cursor:pointer; text-align:start
}
.nav button:hover{background:rgba(255,255,255,.07); color:#fff}
.nav button.on{background:rgba(232,192,88,.14); color:var(--gold)}
.nav .grp{
  font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.34);
  padding:16px 12px 7px; font-weight:800
}
.nav .cnt{
  margin-inline-start:auto; background:rgba(255,255,255,.14); color:#fff; border-radius:20px;
  padding:1px 7px; font-size:11px; font-weight:700
}
.nav button.on .cnt{background:var(--gold); color:var(--teal-900)}
.side .foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,.10); font-size:11.5px; color:rgba(255,255,255,.45)}

/* ---------------- main ---------------- */
.main{flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden}
.top{
  flex:none; background:#fff; border-bottom:1px solid var(--line);
  padding:14px 26px; display:flex; align-items:center; gap:16px
}
.top h1{margin:0; font-size:19px; font-weight:800; letter-spacing:-.01em}
.top .sub{font-size:12.5px; color:var(--muted); margin-top:1px}
.spacer{flex:1}
.tbtn{
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 13px;
  font-size:12.5px; font-weight:700; color:var(--ink-2); cursor:pointer; display:flex; align-items:center; gap:7px
}
.tbtn:hover{border-color:var(--teal-600); color:var(--teal)}
.tbtn.pri{background:var(--teal); border-color:var(--teal); color:#fff}
.tbtn.pri:hover{background:var(--teal-600)}
.who{display:flex; align-items:center; gap:10px; padding-inline-start:14px; border-inline-start:1px solid var(--line)}
.who .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0A5B75,#00293B);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.who .nm{font-size:12.5px;font-weight:700;line-height:1.25}
.who .rl{font-size:11px;color:var(--muted)}

.scroll{flex:1; overflow-y:auto; padding:22px 26px 40px}

/* ---------------- primitives ---------------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card .hd{padding:15px 18px 0; display:flex; align-items:flex-start; gap:12px}
.card .hd h2{margin:0; font-size:14.5px; font-weight:800}
.card .hd .d{font-size:12px; color:var(--muted); margin-top:2px}
.card .bd{padding:16px 18px 18px}
.grid{display:grid; gap:16px}
.g6{grid-template-columns:repeat(6,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
@media (max-width:1240px){.g6{grid-template-columns:repeat(3,1fr)} .g21,.g12,.g2{grid-template-columns:1fr}}
.mb{margin-bottom:16px}
.sect{font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:800; margin:26px 0 12px}
.sect:first-child{margin-top:0}

/* stat tile */
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow)}
.stat .k{font-size:11.5px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px}
.stat .v{font-size:27px; font-weight:800; letter-spacing:-.02em; margin:7px 0 3px; line-height:1}
.stat .m{font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:5px}
.up{color:var(--good)} .down{color:var(--critical)} .flat{color:var(--muted)}
.meter{height:5px;border-radius:99px;background:var(--grid);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--teal-600)}

/* pill / status — icon + label, never colour alone */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill svg{flex:none}
.p-good{background:var(--good-soft);color:#0a7a0a}
.p-warn{background:var(--warning-soft);color:#8a6205}
.p-ser{background:var(--serious-soft);color:#a54f26}
.p-crit{background:var(--critical-soft);color:#a52c2c}
.p-neut{background:#EEF2F3;color:#546873}
.p-info{background:#E7F0F4;color:#00506B}

/* table */
table{width:100%;border-collapse:collapse}
th{
  text-align:start; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:800; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; background:#FBFCFC
}
td{padding:11px 12px; border-bottom:1px solid var(--grid); font-size:13px; vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#F7FAFB}
.num{text-align:end; font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-2)}
.tw{overflow-x:auto}
.strong{font-weight:700}
.sub2{font-size:11.5px;color:var(--muted)}

/* inline magnitude bar inside a table cell */
.ibar{display:flex;align-items:center;gap:8px;min-width:120px}
.ibar .t{flex:1;height:6px;border-radius:99px;background:var(--grid);overflow:hidden}
.ibar .t i{display:block;height:100%;border-radius:99px;background:var(--series-1)}
.ibar .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-2);min-width:56px;text-align:end}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 11px;
  font-size:12.5px; font-family:inherit; color:var(--ink); font-weight:600; outline:none
}
.filters select:focus,.filters input:focus{border-color:var(--teal-600)}
.chipf{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.chipf.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:6px;vertical-align:-1px}
.viewtog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewtog button{border:none;background:#fff;padding:6px 11px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.viewtog button.on{background:var(--teal);color:#fff}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{
  position:absolute;pointer-events:none;background:var(--teal-900);color:#fff;border-radius:8px;
  padding:8px 11px;font-size:12px;font-weight:600;opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,41,59,.25)
}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;color:var(--gold);font-weight:700;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px}
.tip .r i{width:8px;height:8px;border-radius:2px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(9,26,34,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(600px,94vw);background:var(--plane);
  z-index:50;transform:translateX(102%);transition:transform .26s cubic-bezier(.3,.8,.35,1);
  display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(9,26,34,.18)
}
html[dir="rtl"] .drawer{transform:translateX(-102%)}
.drawer.on{transform:translateX(0)!important}
.drawer .dh{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:flex-start;gap:12px;flex:none}
.drawer .dh h2{margin:0;font-size:16px;font-weight:800}
.drawer .db{flex:1;overflow-y:auto;padding:18px 20px 30px}
.x{border:none;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;display:flex}
.x:hover{background:var(--grid);color:var(--ink)}

.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:700}

.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding-inline-start:24px;padding-bottom:16px}
.tl li::before{content:"";position:absolute;inset-inline-start:0;top:4px;width:10px;height:10px;border-radius:50%;background:var(--good)}
.tl li.now::before{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.tl li.todo::before{background:#fff;border:2px solid var(--axis)}
.tl li::after{content:"";position:absolute;inset-inline-start:4.5px;top:15px;bottom:0;width:1.5px;background:var(--grid)}
.tl li:last-child::after{display:none}
.tl .s{font-size:13px;font-weight:700}
.tl .m{font-size:11.5px;color:var(--muted);margin-top:1px}

label.f{display:block;font-size:11.5px;font-weight:800;color:var(--ink-2);margin:0 0 6px}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;font-weight:600;color:var(--ink);outline:none}
.inp:focus{border-color:var(--teal-600)}
.req{color:var(--critical)}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.warnbox{background:var(--warning-soft);border:1px solid #F2DFB0;border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:600;color:#7A5C12;display:flex;gap:9px;align-items:flex-start}
.okbox{background:var(--good-soft);border:1px solid #C8E6C8;border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:600;color:#0a7a0a;display:flex;gap:9px;align-items:flex-start}
.btn{border:none;border-radius:9px;padding:11px 16px;font-size:13.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--teal);color:#fff}
.btn.pri:disabled{background:#B9C6CC;cursor:not-allowed}
.btn.gh{background:#fff;color:var(--ink-2);border:1px solid var(--line)}

.toast{position:fixed;bottom:22px;inset-inline-end:22px;background:var(--teal-900);color:#fff;border-radius:10px;
  padding:13px 17px;font-size:13px;font-weight:700;z-index:80;opacity:0;transform:translateY(8px);transition:.2s;
  display:flex;gap:9px;align-items:center;max-width:420px;box-shadow:0 10px 30px rgba(0,41,59,.3)}
.toast.on{opacity:1;transform:none}

.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:10px}
.demo{
  background:var(--gold-soft);border:1px solid #EFDFB4;border-radius:9px;padding:10px 13px;
  font-size:12px;font-weight:700;color:var(--gold-ink);display:flex;gap:9px;align-items:center;margin-bottom:16px
}
html[dir="rtl"] .flipi{transform:scaleX(-1)}
@media (max-width:900px){
  body{overflow:auto}
  .side{display:none}
  .main{height:auto}
}
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <img id="brandLock" alt="Almaria Residence">
    <div class="sub" id="brandSub">Management Console</div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="foot" id="sideFoot"></div>
</aside>

<div class="main">
  <header class="top">
    <div>
      <h1 id="pgTitle"></h1>
      <div class="sub" id="pgSub"></div>
    </div>
    <div class="spacer"></div>
    <button class="tbtn" onclick="setLang(LANG==='en'?'ar':'en')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
      <span id="langLbl">العربية</span>
    </button>
    <button class="tbtn" id="expBtn" onclick="toast(T('t_export'))"></button>
    <div class="who">
      <div class="av">MS</div>
      <div>
        <div class="nm" id="whoNm"></div>
        <div class="rl" id="whoRl"></div>
      </div>
    </div>
  </header>
  <div class="scroll" id="page"></div>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>

 let g='';
 for(let t=0;t<=max;t+=max/4){
  const y=PT+ih-(t/max)*ih;
  g+=`<line x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${PL-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${NUM(t)}</text>`;
 }
 let b='';
 byMonth.forEach((m,i)=>{
  const x0=PL+i*bw+5;
  [['raised',m.raised,0],['closed',m.closed,1]].forEach(([k,v,si])=>{
   const h=(v/max)*ih, x=x0+si*(bar+2), y=PT+ih-h;
   b+=`<rect x="${x}" y="${y}" width="${bar}" height="${h}" rx="4" fill="${SER[si]}"
        class="hb" data-i="${i}" data-k="${k}"/>`;
  });
  b+=`<text x="${x0+bar+1}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${L(m.en,m.ar)}</text>`;
 });
 /* selective direct labels: latest month only */
 const lm=byMonth[5], x0=PL+5*bw+5;
 b+=`<text x="${x0+bar/2}" y="${PT+ih-(lm.raised/max)*ih-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">${NUM(lm.raised)}</text>`;
 b+=`<text x="${x0+bar+2+bar/2}" y="${PT+ih-(lm.closed/max)*ih-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">${NUM(lm.closed)}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" role="img">
   <line x1="${PL}" x2="${W-PR}" y1="${PT+ih}" y2="${PT+ih}" stroke="var(--axis)" stroke-width="1"/>${g}${b}</svg>`;
}

function wireFlow(root){
 const tip=root.querySelector('.tip');
 root.querySelectorAll('.hb').forEach(el=>{
  el.style.cursor='crosshair';
  el.addEventListener('mousemove',e=>{
   const m=byMonth[+el.dataset.i];
   tip.innerHTML=`<b>${L(m.en,m.ar)} ${NUM(2026)}</b>
     <div class="r"><i style="background:var(--series-1)"></i>${T('raised')} ${NUM(m.raised)}</div>
     <div class="r"><i style="background:var(--series-2)"></i>${T('closed')} ${NUM(m.closed)}</div>`;
   const r=root.getBoundingClientRect();
   tip.style.left=(e.clientX-r.left+12)+'px';tip.style.top=(e.clientY-r.top-46)+'px';tip.classList.add('on');
  });
  el.addEventListener('mouseleave',()=>tip.classList.remove('on'));
 });
}
function wireSla(root){

 root.querySelectorAll('.hp').forEach(el=>{

/* ---------- unit performance (R8 + R14) ---------- */
let FSORT={k:'unit',dir:1}, FONLY=false;
function fsort(k){ FSORT = (FSORT.k===k) ? {k,dir:-FSORT.dir} : {k,dir:k==='unit'?1:-1}; render(); }
function finRows(){
 const rows=UNITS.map(u=>{
  const maint=unitCost(u), coll=u.collected||0;
  return {u, annual:u.occupied?u.rent:0, billed:u.billed||0, coll,
    out:u.outstanding||0, od:u.overdueDays||0, maint,
    net:coll-maint, pct:u.billed?maint/u.billed*100:0};
 });
 const k=FSORT.k, d=FSORT.dir;
 rows.sort((a,b)=>{
  if(k==='unit'){const na=parseInt(a.u.u)||999, nb=parseInt(b.u.u)||999; return (na-nb)*d;}
  return ((a[k]||0)-(b[k]||0))*d;
 });
 return rows;
}
const sortable=(k,label,cls='')=>`<th class="${cls}" style="cursor:pointer;user-select:none" onclick="fsort('${k}')">${label}${FSORT.k===k?(FSORT.dir>0?' ▲':' ▼'):''}</th>`;

      <div style="font-size:11.5px;color:var(--muted);font-weight:600">${a.n?NUM(a.n)+' '+L(a.n===1?'unit':'units','وحدة'):'—'}</div>
      <div class="meter" style="margin-top:8px"><i style="width:${(a.amt/maxAge*100).toFixed(1)}%;background:${a.b.lo>=31?'var(--critical)':a.b.lo>=1?'var(--warning)':'var(--series-1)'}"></i></div>

 </div>

 <div class="card">
   <div class="hd"><div style="flex:1"><h2>${T('f_table')}</h2><div class="d">${T('f_table_d')}</div></div>
     <button class="tbtn ${FONLY?'pri':''}" onclick="FONLY=!FONLY;render()">${I('alert',14)}<span>${T('f_arronly')}</span></button></div>

       </tr>`;}).join('')}
     </tbody>
     <tfoot><tr style="background:#FBFCFC">
       <td colspan="4" class="strong">${L('Total','الإجمالي')}</td>
       <td class="num mono strong">${money(FIN.contracted)}</td>

function finDetail(uid){
 const u=UNITS.find(x=>x.u===uid);if(!u)return;
 const maint=unitCost(u);
 const jobs=DONE.filter(w=>w.unit===uid).sort((a,b)=>b.raised-a.raised);
 const openJobs=OPEN.filter(w=>w.unit===uid);
 const instRow=x=>{
  const st = !x.billed ? ['p-neut','f_notdue',null]
    : x.paid ? ['p-good','f_paid','check']
    : ((TODAY-x.due)/864e5>0 ? ['p-crit','f_overdue','alert'] : ['p-warn','f_due','clock']);
  return `<tr>
   <td class="strong">${T('f_instal')} ${NUM(x.q)}</td>
   <td class="mono">${fmtD(x.due)}</td>
   <td class="num mono">${money(x.amt)}</td>
   <td class="mono sub2">${x.paidOn?fmtD(x.paidOn):'—'}</td>
   <td><span class="pill ${st[0]}">${st[2]?I(st[2],12,2.1):''}${T(st[1])}</span></td></tr>`;
 };
 openDrawer(`${L('Apartment','شقة')} ${NUM(u.u)}<div style="font-size:12px;color:var(--muted);font-weight:600;margin-top:2px">${u.type} · ${NUM(u.area)} m² · ${L('Floor','الدور')} ${NUM(u.floor)}</div>`,
  !u.occupied ? `
   <div class="card"><div class="bd">
     <div class="warnbox">${I('alert',16,2.2)}<span>${T('f_vacantnote')}</span></div>
     ${maint?`<dl class="kv" style="margin-top:14px"><dt>${T('h_maint')}</dt><dd>${money(maint)} ${T('sar')}</dd></dl>`:''}
   </div></div>`
  : `
  <div class="grid g3 mb" style="gap:10px">
    ${stat(T('h_coll'),money(u.collected),{t:T('h_billed')+' '+money(u.billed),cls:'flat'})}
    ${stat(T('h_out'),money(u.outstanding),{t:u.overdueDays?NUM(u.overdueDays)+L('d overdue','ي تأخير'):T('f_none'),cls:u.outstanding?'down':'up',ic:u.outstanding?'alert':'check'})}
    ${stat(T('h_maint'),money(maint),{t:NUM((maint/u.billed*100).toFixed(1))+'% '+L('of billed','من المفوتر'),cls:'flat'})}
  </div>

  <div class="sect" style="margin-top:0">${T('f_lease')}</div>
  <div class="card mb"><div class="bd"><dl class="kv">
    <dt>${T('tenant')}</dt><dd>${L(u.tenant,u.tenant_ar)}</dd>
    <dt>${T('f_term')}</dt><dd>${fmtD(u.leaseStart)} — ${fmtD(u.leaseEnd)}</dd>
    <dt>${T('h_annual')}</dt><dd>${money(u.rent)} ${T('sar')}</dd>
    <dt>${T('f_profile')}</dt><dd>${u.profile==='good'?`<span class="pill p-good">${I('check',12,2.1)}${T('p_good')}</span>`
      :u.profile==='late'?`<span class="pill p-warn">${I('clock',12,2.1)}${T('p_late')}</span>`
      :`<span class="pill p-crit">${I('alert',12,2.1)}${T('p_problem')}</span>`}</dd>
    <dt>${T('h_net')}</dt><dd>${money(u.collected-maint)} ${T('sar')}</dd>
  </dl></div></div>

  <div class="sect">${T('f_sched')}</div>
  <div class="card mb"><div class="tw"><table>
    <thead><tr><th>${T('f_instal')}</th><th>${T('f_duedate')}</th><th class="num">${T('f_amount')}</th><th>${T('f_paidon')}</th><th>${T('status')}</th></tr></thead>
    <tbody>${u.inst.map(instRow).join('')}</tbody>
  </table></div></div>

  <div class="sect">${T('f_hist')}</div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>${T('ref')}</th><th>${T('category')}</th><th>${T('raised_c')}</th><th class="num">${T('cost')}</th><th>${T('status')}</th></tr></thead>
    <tbody>
    ${openJobs.map(w=>`<tr><td class="mono">${w.id}</td><td>${catName(CAT(w.cat))}</td>
      <td class="mono">${fmtD(w.raised)}</td><td class="num mono">—</td><td>${stPill(w.status)}</td></tr>`).join('')}
    ${jobs.slice(0,12).map(w=>`<tr><td class="mono">${w.id}</td><td>${catName(CAT(w.cat))}</td>
      <td class="mono">${fmtD(w.raised)}</td><td class="num mono">${money(w.mat+w.labH*85)}</td><td>${stPill(w.status)}</td></tr>`).join('')}
    ${(jobs.length+openJobs.length)===0?`<tr><td colspan="5" class="sub2" style="text-align:center;padding:18px">${L('No maintenance recorded','لا توجد صيانة مسجلة')}</td></tr>`:''}
    </tbody>
    <tfoot><tr style="background:#FBFCFC"><td colspan="3" class="strong">${L('Total','الإجمالي')}</td>
      <td class="num mono strong">${money(maint)}</td><td></td></tr></tfoot>
